name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: ubuntu-latest runners already ship with the Android SDK
      # at $ANDROID_SDK_ROOT, so we do NOT use setup-android (it was failing).
      # sdkmanager is NOT on PATH — use the full path.
      - name: Accept licenses + install packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests, lint, and debug build
        # Debug builds are for testing only: each CI runner signs with its own
        # throwaway debug key, so debug APKs can NEVER update each other
        # (Android rejects it as "package conflicts with an existing package").
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Name debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/gh-widgets.apk

      - name: Upload widget render checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          path: app/build/widget-renders/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH-widgets
          path: app/build/outputs/apk/debug/gh-widgets.apk

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses + install packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify release version matches tag
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Release tag must match app version v$VERSION"; exit 1; }

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for var in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required release signing secret: $var" >&2
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK and App Bundle
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Clean up release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Name signed release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/gh-widgets.apk

      - name: Upload release App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH-widgets-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          name: GH-widgets ${{ github.ref_name }}
          files: app/build/outputs/apk/release/gh-widgets.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
