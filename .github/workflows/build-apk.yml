name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: ubuntu-latest runners already ship with the Android SDK
      # at $ANDROID_SDK_ROOT, so we do NOT use setup-android (it was failing).
      # sdkmanager is NOT on PATH — use the full path.
      - name: Accept licenses + install packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        # Debug builds are for testing only: each CI runner signs with its own
        # throwaway debug key, so debug APKs can NEVER update each other
        # (Android rejects it as "package conflicts with an existing package").
        # Tagged releases below build + sign a proper release APK instead.
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Release tag must match app version v$VERSION"; exit 1; }

      - name: Name debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/gh-widgets.apk

      - name: Upload widget render checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          path: app/build/widget-renders/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH-widgets
          path: app/build/outputs/apk/debug/gh-widgets.apk

      # Tagged releases (v*) are what users install: assembleRelease signs them
      # with the persistent repo keystore (see app/build.gradle.kts), so every
      # version carries the same signature and installs cleanly over the
      # previous one instead of "conflicts with an existing package".
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Name signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/gh-widgets.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GH-widgets ${{ github.ref_name }}
          files: app/build/outputs/apk/release/gh-widgets.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
