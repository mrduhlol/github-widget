name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: ubuntu-latest runners already ship with the Android SDK
      # at $ANDROID_SDK_ROOT, so we do NOT use setup-android (it was failing).
      # sdkmanager is NOT on PATH — use the full path.
      - name: Accept licenses + install packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        # Debug builds are for testing only: each CI runner signs with its own
        # throwaway debug key, so debug APKs can NEVER update each other
        # (Android rejects it as "package conflicts with an existing package").
        # Tagged releases below build + sign a proper release APK instead.
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/GH-widget.v${VERSION}.apk"
          # Stable filename: README links to this so version bumps never break the download.
          cp "app/build/outputs/apk/debug/GH-widget.v${VERSION}.apk" app/build/outputs/apk/debug/GH-widget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH-widgets
          path: app/build/outputs/apk/debug/GH-widget*.apk

      # Tagged releases (v*) are what users install: build + sign them with the
      # persistent release key so every version carries the same signature and
      # installs cleanly over the previous one. Requires repo secrets:
      # SIGNING_KEYSTORE_BASE64, SIGNING_KEY_ALIAS,
      # SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_PASSWORD.
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: 34.0.0

      - name: Rename signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIGNED=$(ls app/build/outputs/apk/release/*signed*.apk | head -n 1)
          mv "$SIGNED" "app/build/outputs/apk/release/GH-widget.v${VERSION}.apk"
          # Stable filename: README and the in-app updater link to this.
          cp "app/build/outputs/apk/release/GH-widget.v${VERSION}.apk" app/build/outputs/apk/release/GH-widget.apk

      # On tags like v3.0.0, attach the APK to a GitHub Release so README can link it.
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/GH-widget.v*.apk
            app/build/outputs/apk/release/GH-widget.apk
          generate_release_notes: true
